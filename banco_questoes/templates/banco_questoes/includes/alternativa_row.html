<div class="alternativa-row row g-2 align-items-center mb-2"
     {% if form.instance.pk %}data-pk="{{ form.instance.pk }}"{% endif %}>

  {# Campo DELETE oculto (soft delete para o Django) #}
  <input type="hidden"
         name="{{ form.DELETE.html_name }}"
         id="{{ form.DELETE.id_for_label }}"
         class="alternativa-delete"
         value="{{ form.DELETE.value|default:'' }}">

  {# ID oculto (necessário para edição) #}
  {{ form.id }}

  <div class="col-auto">
    <label class="visually-hidden" for="{{ form.letra.id_for_label }}">Letra</label>
    {{ form.letra }}
  </div>

  <div class="col">
    <label class="visually-hidden" for="{{ form.texto.id_for_label }}">Texto</label>
    {{ form.texto }}
  </div>

  <div class="col-auto">
    <div class="form-check mt-1">
      {{ form.correta }}
      <label class="form-check-label" for="{{ form.correta.id_for_label }}">Correta</label>
    </div>
  </div>

  <div class="col-auto">
    <button type="button" class="btn btn-outline-danger btn-sm btn-remove-alternativa"
            title="Remover alternativa">✕</button>
  </div>

  {% if form.errors %}
  <div class="col-12">
    {% for error in form.errors.values %}
    <div class="text-danger small">{{ error|join:", " }}</div>
    {% endfor %}
  </div>
  {% endif %}
</div>
