<div class="alternativa-card-item {% if form.correta.value %}is-correct{% endif %} {% if form.errors %}border-danger{% endif %}"
     {% if form.instance.pk %}data-pk="{{ form.instance.pk }}"{% endif %}>

  {# Campo DELETE oculto para soft delete #}
  <input type="hidden"
         name="{{ form.DELETE.html_name }}"
         id="{{ form.DELETE.id_for_label }}"
         class="alternativa-delete"
         value="{{ form.DELETE.value|default:'' }}">

  {# ID oculto para edição #}
  {{ form.id }}

  <div class="flex items-start gap-4 alternativa-row" style="width: 100%;">
    <!-- Seletor de Letra -->
    <div class="alt-letra">
      <label class="form-label">
        <i class="bi bi-tag-fill me-1"></i> Letra
      </label>
      {{ form.letra }}
      {% if form.letra.errors %}
      <div class="invalid-feedback">{{ form.letra.errors|join:", " }}</div>
      {% endif %}
    </div>

    <!-- Texto da Alternativa -->
    <div class="flex-grow alt-texto">
      <label class="form-label">
        <i class="bi bi-fonts me-1"></i> Texto da Alternativa
      </label>
      {{ form.texto }}
      {% if form.texto.errors %}
      <div class="invalid-feedback">{{ form.texto.errors|join:", " }}</div>
      {% endif %}
    </div>

    <!-- Checkbox de Gabarito/Correta -->
    <div class="alt-correta">
      <label class="form-label text-center">Gabarito?</label>
      <div class="flex items-center justify-center gap-2 mt-2">
        {{ form.correta }}
        <label class="font-bold small text-success" for="{{ form.correta.id_for_label }}">Correta</label>
      </div>
    </div>

    <!-- Botão de Remoção -->
    <div class="alt-remover">
      <button type="button" class="btn-danger-circle btn-remove-alternativa" title="Remover Alternativa">
        <i class="bi bi-trash3"></i>
      </button>
    </div>
  </div>
</div>
