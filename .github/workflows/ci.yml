name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

# ────────────────────────────────────────────────────────────
# Shared env vars for all jobs
# ────────────────────────────────────────────────────────────
env:
  SECRET_KEY: ci-test-secret-key-not-for-production
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1
  DATABASE_URL: sqlite:///db.sqlite3
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ══════════════════════════════════════════════════════════
  #  1. LINT — Ruff (substitui flake8 + isort + bandit)
  # ══════════════════════════════════════════════════════════
  lint:
    name: "🔍 Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ruff
        run: pip install "ruff>=0.5.0"

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff security rules (bandit)
        run: ruff check . --select S --output-format=github

  # ══════════════════════════════════════════════════════════
  #  2. FORMAT — Ruff formatter (substitui Black + isort)
  # ══════════════════════════════════════════════════════════
  format:
    name: "🎨 Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ruff
        run: pip install "ruff>=0.5.0"

      - name: Check formatting (Black-compatible)
        run: ruff format --check --diff .

      - name: Check import ordering (isort-compatible)
        run: ruff check --select I --diff .

  # ══════════════════════════════════════════════════════════
  #  3. TEST — Django migrations, system checks & test suite
  # ══════════════════════════════════════════════════════════
  test:
    name: "🧪 Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check --fail-level WARNING

      - name: Run migrations
        run: python manage.py migrate

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: |
          coverage run manage.py test --verbosity=2
          coverage report
          coverage xml -o coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ══════════════════════════════════════════════════════════
  #  4. QUALITY GATE — Barreira final (depende dos 3 acima)
  # ══════════════════════════════════════════════════════════
  quality-gate:
    name: "✅ Quality Gate"
    runs-on: ubuntu-latest
    needs: [lint, format, test]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "== Quality Gate Results =="
          echo "  Lint:   ${{ needs.lint.result }}"
          echo "  Format: ${{ needs.format.result }}"
          echo "  Test:   ${{ needs.test.result }}"
          echo "=========================="

          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Lint failed"
            exit 1
          fi
          if [[ "${{ needs.format.result }}" != "success" ]]; then
            echo "❌ Format failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ Tests failed"
            exit 1
          fi

          echo "✅ All quality checks passed!"
